name: Apna Scheduler Backup Trigger

on:
  schedule:
    # Runs every 10 minutes (cron format: minute hour day-of-month month day-of-week)
    # Free-tier Render web services sleep after 15 minutes of inactivity.
    # This GitHub Action pings the tick endpoint to wake the container and trigger due jobs.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  tick:
    name: Ping Internal Tick Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Apna Scheduler Tick
        run: |
          echo "Sending Tick request to Apna Scheduler API..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.SCHEDULER_API_URL }}/internal/tick" \
            -H "X-Tick-Secret: ${{ secrets.INTERNAL_TICK_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120)

          echo "Response HTTP Status: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Tick completed successfully."
            exit 0
          elif [ "$HTTP_STATUS" -eq 429 ]; then
            echo "Throttled by rate limiter - another tick was recent."
            exit 0
          else
            echo "Failed with status $HTTP_STATUS"
            exit 1
          fi
